<nav *ngIf="router.url !== '/auth'" class="navbar navbar-expand-lg glass-panel sticky-top mb-4 px-3" style="border-radius: 0 0 16px 16px;">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3" routerLink="/search" style="color: var(--accent-red)">
      Fit<span style="color: var(--text-color)">Hae</span>
    </a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto align-items-center">
        <li class="nav-item">
          <a class="nav-link fw-500" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-500" routerLink="/search" routerLinkActive="active">Search</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-500" routerLink="/about-us" routerLinkActive="active">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-500" routerLink="/leaderboard" routerLinkActive="active">Leaderboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-500" routerLink="/verify-coupon" routerLinkActive="active">Verify Coupon</a>
        </li>
        <li class="nav-item" *ngIf="isAdmin">
          <a class="nav-link fw-bold p-2 px-3 rounded-pill bg-danger bg-opacity-10 text-danger ms-lg-3" 
             routerLink="/admin-panel" routerLinkActive="active" 
             style="border: 1px dashed rgba(220, 38, 38, 0.3);">
            <i class="fa-solid fa-shield-halved me-1"></i> Admin Portal
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <!-- Live PKT Clock -->
        <span class="badge rounded-pill glass-panel fw-normal d-flex align-items-center gap-2 px-3 py-2" style="color: var(--text-color);">
          <i class="fa-solid fa-clock text-warning"></i> PKT: {{ currentTimePKT() }}
        </span>

        <!-- Theme Toggle -->
        <button class="btn btn-sm glass-panel text-muted rounded-circle p-2 d-flex align-items-center justify-content-center" 
                style="width: 36px; height: 36px;" (click)="toggleTheme()">
          <i class="fa-solid" [ngClass]="isDarkMode() ? 'fa-sun text-warning' : 'fa-moon text-primary'"></i>
        </button>

        <ng-container *ngIf="authService.isLoggedIn$ | async; else loggedOut">
          <a class="nav-link" routerLink="/add" routerLinkActive="text-danger fw-bold" title="Add Restaurant">
            <i class="fa-solid fa-plus-circle fs-5"></i>
          </a>
          
          <div class="dropdown">
            <button class="btn btn-outline-secondary rounded-pill d-flex align-items-center gap-2 px-3 dropdown-toggle" 
                    type="button" data-bs-toggle="dropdown" style="background: var(--input-bg); color: var(--text-color); border-color: var(--glass-border)">
              <i class="fa-solid fa-user-circle"></i> {{ authService.getUserName() }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end glass-panel mt-2 p-2">
              <li><a class="dropdown-item rounded" routerLink="/my-account"><i class="fa-solid fa-gear me-2"></i>My Account</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item text-danger rounded" (click)="authService.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</button></li>
            </ul>
          </div>
        </ng-container>

        <ng-template #loggedOut>
          <a class="btn btn-primary-custom" routerLink="/auth"><i class="fa-solid fa-right-to-bracket me-2"></i>Login</a>
        </ng-template>
        
        <button *ngIf="authService.isLoggedIn$ | async" 
                class="btn btn-outline-danger rounded-pill px-3 py-2 d-flex align-items-center gap-2"
                (click)="authService.logout()">
          <i class="fa-solid fa-power-off"></i> <span class="d-none d-md-inline">Logout</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <router-outlet></router-outlet>
</div>

<!-- Custom Cursor Elements -->
<div class="custom-cursor" [style.transform]="'translate(' + cursorX + 'px, ' + cursorY + 'px)'"></div>
<div class="cursor-trail" *ngFor="let trail of trails" [style.transform]="'translate(' + trail.x + 'px, ' + trail.y + 'px)'"></div>
