<div class="container mt-5 py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div *ngIf="errorMessage" class="alert glass-panel mb-4 text-center text-danger animate-fade-in">
        <i class="fa-solid fa-circle-exclamation me-2"></i> {{ errorMessage }}
      </div>

      <div class="glass-panel p-5 text-center position-relative overflow-hidden">
        <div class="mb-4">
          <div class="icon-circle mx-auto mb-3" style="background: linear-gradient(135deg, var(--accent-maroon), var(--accent-red)); width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 10px 20px rgba(211, 47, 47, 0.2);">
            <i class="fa-solid fa-map-location-dot fa-2x text-white"></i>
          </div>
          <h2 class="fw-bold mb-2" style="color: var(--text-color);">Onboard a Spot</h2>
          <p style="color: var(--text-muted);">
            Paste a Google Maps share link to automatically import restaurant details.
          </p>
        </div>

        <div class="form-floating mb-4">
          <input type="text" 
                 class="form-control" 
                 id="googleMapsLink" 
                 [(ngModel)]="googleMapsLink"
                 placeholder="https://maps.app.goo.gl/..."
                 [disabled]="isLoading">
          <label for="googleMapsLink" style="color: var(--text-muted);">Google Maps Share Link</label>
        </div>

        <button class="btn btn-primary-custom w-100 py-3 fs-5 fw-bold" 
                (click)="onAdd()" 
                [disabled]="!googleMapsLink || isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          {{ isLoading ? 'Retrieving Intelligence...' : 'Add to FitHae' }}
        </button>

        <div class="mt-4 pt-3 border-top border-secondary border-opacity-10">
          <p class="small mb-0" style="color: var(--text-muted);">
            <i class="fa-solid fa-circle-info me-1"></i> 
            Our AI will detect the city, name, and photos automatically.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
