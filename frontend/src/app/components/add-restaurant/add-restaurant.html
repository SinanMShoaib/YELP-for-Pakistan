<div class="container mt-5 py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div *ngIf="errorMessage" class="alert glass-panel mb-4 text-center text-danger animate-fade-in">
        <i class="fa-solid fa-circle-exclamation me-2"></i> {{ errorMessage }}
      </div>

      <div class="glass-panel p-5 text-center position-relative overflow-hidden">
        <div class="mb-4">
          <div class="icon-circle mx-auto mb-3" style="background: linear-gradient(135deg, var(--accent-maroon), var(--accent-red)); width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 10px 20px rgba(211, 47, 47, 0.2);">
            <i class="fa-solid fa-map-location-dot fa-2x text-white"></i>
          </div>
          <h2 class="fw-bold mb-2" style="color: var(--text-color);">Onboard a Spot</h2>
          <p style="color: var(--text-muted);">
            {{ showManual ? 'Enter details manually for admin review.' : 'Paste a Google Maps share link to automatically import details.' }}
          </p>
        </div>

        <!-- Automated Link Input -->
        <div *ngIf="!showManual" class="animate-fade-in">
          <div class="form-floating mb-4">
            <input type="text" class="form-control" id="googleMapsLink" [(ngModel)]="googleMapsLink" placeholder="Link" [disabled]="isLoading">
            <label for="googleMapsLink">Google Maps Share Link</label>
          </div>
          <button class="btn btn-primary-custom w-100 py-3 fs-5 fw-bold" (click)="onAdd(false)" [disabled]="!googleMapsLink || isLoading">
            {{ isLoading ? 'Retrieving Intelligence...' : 'Auto-Import Spot' }}
          </button>
        </div>

        <!-- Manual Input Form -->
        <div *ngIf="showManual" class="animate-fade-in text-start">
          <div class="mb-3">
            <input type="text" class="form-control" [(ngModel)]="manualData.name" placeholder="Restaurant Name">
          </div>
          <div class="mb-3">
            <input type="text" class="form-control" [(ngModel)]="manualData.location" placeholder="Full Address">
          </div>
          <div class="row mb-3">
            <div class="col">
              <select class="form-select" [(ngModel)]="manualData.city" style="background: var(--input-bg); color: var(--text-color);">
                <option value="">Select City</option>
                <option value="islamabad">Islamabad</option>
                <option value="rawalpindi">Rawalpindi</option>
                <option value="lahore">Lahore</option>
                <option value="karachi">Karachi</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <input type="text" class="form-control" [(ngModel)]="manualData.imageUrl" placeholder="Image URL (Optional)">
          </div>
          <div class="mb-4">
            <textarea class="form-control" [(ngModel)]="manualData.description" rows="3" placeholder="Brief Description"></textarea>
          </div>
          <button class="btn btn-primary-custom w-100 py-3 fs-5 fw-bold" (click)="onAdd(true)" [disabled]="isLoading">
            {{ isLoading ? 'Submitting...' : 'Submit for Review' }}
          </button>
        </div>

        <div class="mt-4 pt-3 border-top border-secondary border-opacity-10">
          <button class="btn btn-link text-decoration-none text-danger small fw-bold" (click)="showManual = !showManual">
            {{ showManual ? 'Back to Auto-Import' : 'Add details manually instead' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
