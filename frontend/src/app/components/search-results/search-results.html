<div class="row g-4 mt-2">
  <div class="col-md-3">
    <div class="glass-panel p-4 sticky-top" style="top: 100px; z-index: 10;">
      <h5 class="fw-bold mb-4" style="color: var(--text-color);">Filters</h5>
      
      <div class="mb-3">
        <label class="small text-uppercase fw-bold mb-2" style="color: var(--text-muted);">City</label>
        <select class="form-select bg-transparent" [(ngModel)]="filters.city" (change)="search()" style="color: var(--text-color); border: 1px solid var(--glass-border); border-radius: 12px;">
          <option value="">All Regions</option>
          <option value="islamabad">Islamabad</option>
          <option value="rawalpindi">Rawalpindi</option>
          <option value="lahore">Lahore</option>
          <option value="karachi">Karachi</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="small text-uppercase fw-bold mb-2" style="color: var(--text-muted);">Name/Keyword</label>
        <input type="text" class="form-control" [(ngModel)]="filters.name" (input)="search()" placeholder="e.g. Savour" style="padding: 0.75rem 1rem;">
      </div>

      <div class="mb-3">
        <label class="small text-uppercase fw-bold mb-2" style="color: var(--text-muted);">Category</label>
        <input type="text" class="form-control" [(ngModel)]="filters.category" (input)="search()" placeholder="e.g. Desi">
      </div>

      <button class="btn btn-outline-danger w-100 rounded-pill btn-sm mt-3" (click)="filters = {city:'', name:'', category:''}; search()">
        Clear All
      </button>
    </div>
  </div>

  <div class="col-md-9">
    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-danger" role="status"></div>
      <p class="mt-3 text-muted">Analyzing the culinary landscape...</p>
    </div>

    <div *ngIf="!isLoading && restaurants.length === 0" class="text-center py-5 glass-panel animate-fade-in">
      <i class="fa-solid fa-utensils fa-3x mb-3 text-muted opacity-50"></i>
      <h4 style="color: var(--text-color);">No matches found</h4>
      <p style="color: var(--text-muted);">Try adjusting your filters or search keywords.</p>
    </div>

    <div class="row g-4" *ngIf="!isLoading">
      <div class="col-12" *ngFor="let r of restaurants">
        <div class="card glass-panel h-100 border-0 overflow-hidden hover-lift shadow-sm" [routerLink]="['/restaurant', r._id]" style="cursor: pointer;">
          <div class="row g-0">
            <div class="col-md-4 position-relative">
              <img [src]="r.imageUrl || 'assets/default-restaurant.jpg'" class="img-fluid h-100 w-100 object-fit-cover" style="min-height: 200px;">
              <div class="position-absolute top-0 start-0 m-3">
                <span class="badge bg-danger p-2 shadow-sm"><i class="fa-solid fa-star text-warning"></i> {{ r.averageRating || 'N/A' }}</span>
              </div>
            </div>
            <div class="col-md-8 p-4">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h4 class="fw-bold m-0" style="color: var(--text-color);">{{ r.name }}</h4>
                <span class="badge rounded-pill bg-primary bg-opacity-10 text-primary px-3 py-2 fw-normal">{{ r.city | titlecase }}</span>
              </div>
              <p class="mb-3" style="color: var(--text-muted);"><i class="fa-solid fa-location-dot text-danger me-2"></i>{{ r.location }}</p>
              <p class="mb-3 line-clamp-2" style="color: var(--text-color); opacity: 0.8;">{{ r.description }}</p>
              
              <div class="d-flex gap-2 flex-wrap">
                <span class="badge glass-panel text-muted fw-normal px-3 py-2 border-opacity-10" *ngFor="let cat of r.categories?.slice(0, 3)">{{ cat }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
